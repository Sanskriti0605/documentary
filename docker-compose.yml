services:
  # -------------------------------------------------------------
  # Ollama LLM Runtime
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: verifydoc-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Optional NVIDIA GPU acceleration (uncomment if NVIDIA GPU runtime is available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # -------------------------------------------------------------
  # Ollama Model Initialization (One-shot Model Pull)
  # -------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: verifydoc-ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"]

  # -------------------------------------------------------------
  # VerifyDoc FastAPI Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifydoc-backend
    env_file: .env
    environment:
      - HF_HOME=/models/hf
      - STORAGE_DIR=/app/storage
      - UPLOAD_DIR=/app/storage/uploads
      - RENDERED_DIR=/app/storage/rendered
      - QDRANT_STORAGE_PATH=/app/storage/qdrant
      - DATABASE_URL=sqlite+aiosqlite:////app/storage/db/veritas.db
      - SYNC_DATABASE_URL=sqlite:////app/storage/db/veritas.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./storage:/app/storage
      - hf_cache:/models/hf
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # -------------------------------------------------------------
  # VerifyDoc React 18 + Vite Frontend (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=/api
    container_name: verifydoc-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  hf_cache:
