version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: verifydoc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: verifydoc-ollama-pull
    depends_on:
      - ollama
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - "echo 'Waiting for Ollama service...' && sleep 3 && while ! ollama list > /dev/null 2>&1; do sleep 2; done && echo 'Pulling qwen2.5:1.5b...' && ollama pull qwen2.5:1.5b && echo 'Ollama model ready!'"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verifydoc-backend
    ports:
      - "8001:8001"
    volumes:
      - verifydoc-data:/app/storage
      - hf-cache:/root/.cache/huggingface
    environment:
      - VERITAS_PORT=8001
      - VERITAS_HOST=0.0.0.0
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - GENERATION_MODEL=qwen2.5:1.5b
      - NLI_MODEL=cross-encoder/nli-deberta-v3-small
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: verifydoc-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  verifydoc-data:
  ollama-models:
  hf-cache:
