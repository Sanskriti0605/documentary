version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verifydoc-backend
    ports:
      - "8001:8001"
    volumes:
      - verifydoc-data:/app/storage
    environment:
      - VERITAS_PORT=8001
      - VERITAS_HOST=0.0.0.0
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: verifydoc-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  verifydoc-data:
